// -------------------------------------
// - Ultra Graphics Configuration File -
// -------------------------------------

// Effects
cl_ejectbrass 1;                    // Enable brass ejection
muzzleflash_light 1;                // Enable muzzleflash lighting
cl_muzzleflash_dlight_1st 1;        // Enable dynamic muzzleflash lighting in first person
tracer_extra 1;                     // Extra bullet tracers
r_drawtracers_firstperson 1;        // Show tracers in first person
cl_show_splashes 1;                 // Show water splashes
cl_fasttempentcollision 1;          // Optimize temporary entity collisions

// LOD
r_rootlod 0;                        // Set root LOD
r_lod 0;                            // Set LOD
lod_TransitionDist 800;             // Distance for LOD transitions

// Lighting
r_ambientboost 1;                   // Boost ambient light
r_ambientmin 0.6;                   // Minimum ambient light
r_rimlight 1;                       // Enable rim lighting
r_lightaverage 1;                   // Average lighting
r_dynamic 1;                        // Enable dynamic lighting
r_maxdlights 32;                    // Max dynamic lights
r_worldlightmin 0;                  // Minimum world light
r_worldlights 4;                    // Max world lights
mat_disable_lightwarp 0;            // Enable lightwarp
mat_filterlightmaps 1;              // Enable lightmap filtering
mat_phong 1;                        // Enable Phong shading

// Shadows
r_shadows 1;                        // Enable shadows
r_shadowrendertotexture 1;          // Render shadows to texture
cl_blobbyshadows 0;                 // Disable blob shadows
r_flashlightdepthtexture 1;         // Enable flashlight depth textures
r_flashlightdepthres 1024;          // Flashlight depth resolution
r_flashlightrender 1;               // Enable flashlight rendering
r_flashlightmodels 1;               // Enable flashlight on models
r_flashlightscissor 0;              // Disable flashlight scissor
r_shadowmaxrendered 32;             // Max shadows rendered

// Water
cheap_water_none;                 // Disable cheap water
r_WaterDrawReflection 1;          // Enable reflections
r_waterforceexpensive 1;          // Force high-quality water
r_waterforcereflectentities 1;    // Reflect entities in water
r_WaterDrawRefraction 1;          // Enable refraction

// Particles
cl_particle_batch_mode 1;         // Particle batch mode
tf_particles_disable_weather 0;   // Enable weather particles
mat_reduceparticles 0;            // Full particle count
cl_new_impact_effects 1;          // New bullet impact effects
r_drawflecks 1;                   // Draw impact flecks

// Post-processing
mat_hdr_level 2;                        // HDR + bloom
mat_non_hdr_bloom_scalefactor 0.3;      // Bloom intensity
mat_colorcorrection 1;                  // Enable color correction
mat_colcorrection_disableentities 0;    // Enable entity color correction
mat_postprocessing_combine 1;           // Combine post-processing

// Motion Blur
mat_motion_blur_enabled 0;        // Disable motion blur

// Antialiasing
mat_alphacoverage 1;              // Enable alpha-to-coverage
mat_software_aa_strength 1;       // Enable software AA
mat_software_aa_strength_vgui 1;  // AA for HUD
mat_software_aa_quality 1;        // High quality AA
mat_software_aa_edge_threshold 0.5;         // Balance soft/sharp edges
mat_software_aa_blur_one_pixel_lines 0.5;   // AA for thin lines
mat_postprocessing_combine 1;               // Combine post-processing

mat_antialias 4;                  // MSAA 16x CSAA
mat_aaquality 4;                  // Max CSAA quality

// Texture Filtering
mat_trilinear 1;                  // Enable trilinear
mat_forceaniso 8;                 // 8x anisotropic

// Characters
r_flex 1;
flex_rules 1;
anim_3wayblend 1;
ai_expression_optimization 1;
ai_expression_frametime 0.0151;
r_teeth 1;
flex_smooth 1;
mp_usehwmmodels -1;
mp_usehwmvcds -1;
r_eyes 1;
r_eyemove 1;
tf_clientsideeye_lookats 1;
blink_duration 0.2;
phonemefilter 0.08;
phonemesnap 2;

// Decals
r_decals 2048;
mp_decals 2048;
r_decal_cullsize 5;
r_decal_cover_count 8;
r_decal_overlap_area 1.0;
r_decal_overlap_count 8;
r_drawbatchdecals 1;

r_drawmodeldecals 1;
r_maxmodeldecal 32;

r_renderoverlayfragment 0;

// Sprays
cl_allowdownload 0;
cl_allowupload 0;
r_spray_lifetime 0;
cl_playerspraydisable 1;

// Props
r_decalstaticprops 1;
cl_phys_props_enable 1;
cl_phys_props_max 300;
cl_phys_props_respawndist 1500;
cl_phys_props_respawnrate 60;
r_propsmaxdist 3000;
r_drawdetailprops 1;
detail_props_full;
r_staticprop_lod 0;

// Ragdolls
cl_ragdoll_collide 1;
cl_ragdoll_fade_time 15;
cl_ragdoll_forcefade 0;
cl_ragdoll_physics_enable 1;
ragdoll_sleepaftertime 15;
g_ragdoll_fadespeed 600;
g_ragdoll_lvfadespeed 600;

// 3D Sky
r_3dsky 1;

// Jiggle Bones
cl_jiggle_bone_framerate_cutoff 67;

// Textures
mat_picmip -1;
mat_filtertextures 0;
mat_filtertextures 1;

// Texture Blending
mat_disable_fancy_blending 0;

// Bump Mapping
mat_bumpmap 1;

// Specular
mat_specular 1;

// Ropes
rope_rendersolid 1;
r_ropetranslucent 1;
rope_solid_minalpha 0.2;
rope_solid_minwidth 0;
rope_smooth 1;
rope_subdiv 7;
rope_collide 1;
rope_wind_dist 1000;

// HUD Player Model
cl_hud_playerclass_use_playermodel 1;

// Sound
snd_disable_mixer_duck 0;
snd_pitchquality 1;
dsp_slow_cpu 0;
snd_spatialize_roundrobin 0;
dsp_room 1;
dsp_facingaway 31;
dsp_speaker 59;
dsp_water 16;
dsp_spatial 40;